[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pytimelapse"
version = "0.1.0"
description = "A Python library for creating timelapse videos from image sequences"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "opencv-python>=4.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
pytimelapse = "pytimelapse.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pytimelapse*"]
